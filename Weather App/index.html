<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./Style.css" />
  </head>
  <body>
    <div class="animated-background"></div>
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="container">
      <div class="weather-card">
        <div class="card-header">
          <h1 class="title">Weather App</h1>
          <p class="subtitle">Get current weather information</p>
        </div>

        <form class="search-form" id="search-form">
          <div class="input-container">
            <input
              type="text"
              id="city-input"
              placeholder="Enter city name"
              class="search-input"
              autocomplete="off"
            />
            <button type="submit" class="search-btn">
              <svg
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
              </svg>
            </button>
          </div>
        </form>

        <div class="error-container hidden" id="error-container">
          <div class="error-message">
            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <span>City not found. Please try again.</span>
          </div>
        </div>

        <div class="weather-display hidden" id="weather-display">
          <div class="weather-icon-container">
            <img
              id="weather-icon"
              src=""
              alt="Weather icon"
              class="weather-icon"
            />
            <div class="icon-background"></div>
          </div>

          <div class="temperature-section">
            <span class="temperature" id="temperature">0°C</span>
            <p class="city-name" id="city-name">City Name</p>
          </div>

          <div class="weather-details">
            <div class="detail-card">
              <div class="detail-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                  />
                </svg>
              </div>
              <div class="detail-content">
                <span class="detail-value" id="humidity">0%</span>
                <span class="detail-label">Humidity</span>
              </div>
            </div>

            <div class="detail-card">
              <div class="detail-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M3 12h18m-9-9-9 9 9 9" />
                </svg>
              </div>
              <div class="detail-content">
                <span class="detail-value" id="wind-speed">0 km/h</span>
                <span class="detail-label">Wind Speed</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
